name: Release

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  tag-version:
    name: Tag Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or Reuse Version Tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          EXISTING_TAG="$(git tag --points-at HEAD -l 'v*' --sort=-v:refname | head -n1 || true)"
          if [[ -n "$EXISTING_TAG" ]]; then
            TAG="$EXISTING_TAG"
          else
            LATEST_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
            if [[ -z "$LATEST_TAG" ]]; then
              LATEST_TAG="v0.0.0"
            fi

            if [[ ! "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest tag '$LATEST_TAG' is not semver (vMAJOR.MINOR.PATCH)."
              exit 1
            fi

            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            NEXT_PATCH=$((PATCH + 1))
            TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

  build:
    name: Build Artifacts
    needs: tag-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux
          - os: linux-amd64
            goos: linux
            goarch: amd64
          - os: linux-arm64
            goos: linux
            goarch: arm64
          - os: linux-armv7
            goos: linux
            goarch: arm
            goarm: 7
          - os: linux-386
            goos: linux
            goarch: 386
          
          # Windows
          - os: windows-amd64
            goos: windows
            goarch: amd64
          - os: windows-arm64
            goos: windows
            goarch: arm64
          - os: windows-386
            goos: windows
            goarch: 386
          
          # macOS
          - os: macos-amd64
            goos: darwin
            goarch: amd64
          - os: macos-arm64
            goos: darwin
            goarch: arm64
          
          # Android
          - os: android-arm64
            goos: android
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Binaries
        shell: bash
        run: |
          VERSION=${{ needs.tag-version.outputs.version }}
          
          CLIENT_FOLDER="hybrid-relay-google-client-${VERSION}-${{ matrix.os }}"
          HYBRID_FOLDER="hybrid-relay-google-hybrid-${VERSION}-${{ matrix.os }}"
          
          mkdir -p $CLIENT_FOLDER
          mkdir -p $HYBRID_FOLDER
          
          SUFFIX=""
          if [ "${{ matrix.goos }}" == "windows" ]; then
            SUFFIX=".exe"
          fi
          
          # Build Client
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} go build -o $CLIENT_FOLDER/client$SUFFIX ./cmd/client

          # Build Hybrid Exit
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} GOARM=${{ matrix.goarm }} go build -o $HYBRID_FOLDER/hybrid-exit$SUFFIX ./cmd/hybrid-exit
          
          # Copy config examples when present (clean repos may omit some files)
          if [ -f client_config.json.example ]; then
            cp client_config.json.example $CLIENT_FOLDER/client_config.json
          elif [ -f client_config.example.json ]; then
            cp client_config.example.json $CLIENT_FOLDER/client_config.json
          elif [ -f hybrid/SaffronBridge/starter/client_config.example.jsonc ]; then
            cp hybrid/SaffronBridge/starter/client_config.example.jsonc $CLIENT_FOLDER/client_config.example.jsonc
          fi

          if [ -f hybrid/SaffronBridge/starter/client_config.example.jsonc ]; then
            cp hybrid/SaffronBridge/starter/client_config.example.jsonc $HYBRID_FOLDER/client_config.example.jsonc
          fi
          if [ -f hybrid/SaffronBridge/starter/exit_config.example.jsonc ]; then
            cp hybrid/SaffronBridge/starter/exit_config.example.jsonc $HYBRID_FOLDER/exit_config.example.jsonc
          fi
          if [ -f hybrid/SaffronBridge/starter/appscript_relay.gs ]; then
            cp hybrid/SaffronBridge/starter/appscript_relay.gs $HYBRID_FOLDER/appscript_relay.gs
          fi
          
          # Copy README
          cp README.md $CLIENT_FOLDER/
          cp README.md $HYBRID_FOLDER/
          cp HYBRID.MD $HYBRID_FOLDER/
          
          # Zip the folders
          zip -r "${CLIENT_FOLDER}.zip" $CLIENT_FOLDER
          zip -r "${HYBRID_FOLDER}.zip" $HYBRID_FOLDER

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: |
            hybrid-relay-google-client-${{ needs.tag-version.outputs.version }}-${{ matrix.os }}.zip
            hybrid-relay-google-hybrid-${{ needs.tag-version.outputs.version }}-${{ matrix.os }}.zip

  release:
    name: Publish Release
    needs:
      - tag-version
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.tag-version.outputs.tag }}
          name: ${{ needs.tag-version.outputs.tag }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
